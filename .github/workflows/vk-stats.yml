name: VK daily audience snapshot (READ ONLY)

on:
  workflow_dispatch:
  schedule:
    # 00:23 in Ust-Katav, UTC+5; cron is UTC and best-effort.
    - cron: "23 19 * * *"
  push:
    branches: [main]
    paths:
      - 'vk_stats_collector.py'
      - 'tests/test_vk_stats_collector.py'
      - '.github/workflows/vk-stats.yml'
  pull_request:
    branches: [main]
    paths:
      - 'vk_stats_collector.py'
      - 'tests/test_vk_stats_collector.py'
      - '.github/workflows/vk-stats.yml'

permissions:
  contents: write

concurrency:
  group: vk-daily-snapshot
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Offline tests; no credentials and no publishing
        run: |
          python3 -m py_compile vk_stats_collector.py
          python3 -m unittest discover -s tests -p 'test_vk_stats_collector.py' -v

  collect:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Collect only allowed read-only VK counters
        env:
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
          VK_READ_ACCESS_TOKEN: ${{ secrets.VK_READ_ACCESS_TOKEN }}
          VK_STATS_ACCESS_TOKEN: ${{ secrets.VK_STATS_ACCESS_TOKEN }}
        run: python3 vk_stats_collector.py
      - name: Store dated snapshot for weekly HPII reports
        run: |
          set -e
          git add stats/vk/
          if git diff --cached --quiet; then
            echo "Daily VK snapshot unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Save read-only VK audience snapshot [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
