name: Receive Instagram cover (safe test)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/instagram-cover-import.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dzen-telegram
  cancel-in-progress: false

jobs:
  receive:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Initialize state checkpoint
        id: state_init
        run: python3 state_checkpoint.py init
      - name: Install image support
        id: install
        run: python3 -m pip install --disable-pip-version-check pillow
      - name: Read Telegram covers (NO Instagram publication)
        if: ${{ !cancelled() && steps.state_init.outcome == 'success' && steps.install.outcome == 'success' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          test -n "$TELEGRAM_BOT_TOKEN" || { echo "Missing Telegram secret"; exit 1; }
          python3 instagram_cover_inbox.py
      - name: Save image and metadata even after partial failure
        if: ${{ always() && steps.state_init.outcome == 'success' }}
        timeout-minutes: 4
        run: python3 state_checkpoint.py save auxiliary
      - name: Preserve recovery on failure
        if: ${{ always() && steps.state_init.outcome == 'success' && (failure() || cancelled()) }}
        uses: actions/upload-artifact@v4
        with:
          name: state-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hpi-state/recovery/
          if-no-files-found: warn
          retention-days: 7
