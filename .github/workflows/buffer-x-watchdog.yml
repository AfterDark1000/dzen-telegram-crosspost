name: HPII — Buffer X rate-limit watchdog (NO PUBLICATION)
on:
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ['Dzen to Telegram']
    types: [completed]

permissions:
  contents: read
  issues: write

concurrency:
  group: hpii-buffer-x-watchdog
  cancel-in-progress: false

jobs:
  buffer-x-watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect persisted X rate-limit status (NO API PUBLISHING)
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = '[HPII WATCHDOG] Buffer X rate limit';
            const file = await github.rest.repos.getContent({
              owner, repo, path: 'x_editorial_queue.json', ref: 'main'
            });
            if (!file.data.content) throw new Error('X state cannot be inspected');
            const state = JSON.parse(Buffer.from(file.data.content, 'base64').toString('utf8'));
            const active = state.buffer_rate_limit_active === true;
            const {data: issues} = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', per_page: 100
            });
            const existing = issues.find(item => !item.pull_request && item.title === title);
            if (active && !existing) {
              const until = state.buffer_cooldown_until || 'unknown';
              await github.rest.issues.create({
                owner, repo, title,
                body: 'Buffer returned HTTP 429. X posting is not confirmed. ' +
                      'The publisher is in protective cooldown until Unix UTC ' + until +
                      '. Telegram is independent and must not be stopped. ' +
                      'Check Buffer limits and the X post Sent/Error status before closing.'
              });
              core.warning('X rate-limit incident opened; no publishing attempted');
            } else if (!active && existing && state.buffer_last_api_ok_at) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: 'Buffer authenticated API reads recovered at Unix UTC ' +
                      state.buffer_last_api_ok_at +
                      '. This does not independently confirm X post delivery.'
              });
              await github.rest.issues.update({
                owner, repo, issue_number: existing.number, state: 'closed'
              });
            } else if (active) {
              core.warning('X Buffer rate limit persists; existing incident preserved');
            } else {
              core.info('No persisted Buffer 429 incident; X delivery not independently verified');
            }
