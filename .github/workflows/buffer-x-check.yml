name: Buffer X connectivity (READ ONLY)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/buffer-x-check.yml'
      - 'buffer_x_check.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-buffer:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Query Buffer account and X channels (NO PUBLISHING)
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python3 buffer_x_check.py
