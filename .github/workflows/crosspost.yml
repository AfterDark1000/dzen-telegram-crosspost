name: Dzen to Telegram
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dzen-telegram
  cancel-in-progress: false

jobs:
  crosspost:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Instagram feed is intentionally paused; keep Threads and all other routes active.
      INSTAGRAM_FEED_ENABLED: 'false'
      # Set to the UTC UNIX time of an explicit future resumption; never replay backlog.
      INSTAGRAM_RESUME_FROM_UNIX: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Initialize crosspost state safety
        id: state_init
        run: python3 state_checkpoint.py init
      - name: Install browser
        id: install
        run: |
          python3 -m pip install playwright pillow pynacl
          python3 -m playwright install --with-deps chromium
      - name: Read Dzen and post new articles
        if: ${{ !cancelled() && steps.state_init.outcome == 'success' && steps.install.outcome == 'success' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          test -n "$TELEGRAM_BOT_TOKEN" || { echo "Missing TELEGRAM_BOT_TOKEN GitHub Actions secret"; exit 1; }
          python3 crosspost.py
      - name: Post full-text articles to VK
        if: ${{ !cancelled() && steps.state_init.outcome == 'success' && steps.install.outcome == 'success' }}
        env:
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
        run: |
          python3 -m py_compile vk_crosspost.py
          python3 vk_crosspost.py
      - name: Checkpoint delivered Telegram and VK IDs
        id: early_checkpoint
        if: ${{ !cancelled() && steps.state_init.outcome == 'success' }}
        timeout-minutes: 4
        run: python3 state_checkpoint.py save early
      - name: Collect vertical Instagram covers from Telegram channel
        if: ${{ env.INSTAGRAM_FEED_ENABLED == 'true' && !cancelled() && steps.state_init.outcome == 'success' && steps.install.outcome == 'success' && steps.early_checkpoint.outcome == 'success' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python3 -m py_compile instagram_cover_inbox.py instagram_crosspost.py
          python3 -m unittest discover -s tests -p 'test_instagram_cover_inbox.py' -v
          python3 instagram_cover_inbox.py
      - name: Refresh unified HPI editorial archive
        if: ${{ !cancelled() && steps.state_init.outcome == 'success' && steps.install.outcome == 'success' && steps.early_checkpoint.outcome == 'success' }}
        continue-on-error: true
        run: |
          python3 -m unittest discover -s tests -p 'test_editorial_archive.py' -v
          python3 editorial_archive.py
      - name: Checkpoint covers and archive before Instagram
        id: cover_checkpoint
        if: ${{ !cancelled() && steps.state_init.outcome == 'success' && steps.early_checkpoint.outcome == 'success' }}
        timeout-minutes: 4
        run: python3 state_checkpoint.py save covers
      - name: Post new articles to Instagram
        if: ${{ env.INSTAGRAM_FEED_ENABLED == 'true' && !cancelled() && steps.state_init.outcome == 'success' && steps.install.outcome == 'success' && steps.cover_checkpoint.outcome == 'success' }}
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          python3 -m py_compile instagram_crosspost.py
          python3 instagram_crosspost.py
      - name: Post approved Dzen articles to Threads
        if: ${{ !cancelled() && steps.state_init.outcome == 'success' && steps.install.outcome == 'success' && steps.cover_checkpoint.outcome == 'success' }}
        continue-on-error: true
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          python3 -m py_compile threads_crosspost.py threads_editorial_queue.py
          python3 -m unittest discover -s tests -p 'test_threads_editorial_queue.py' -v
          python3 threads_crosspost.py
      - name: Refresh Instagram and Threads tokens when due
        if: ${{ !cancelled() && steps.state_init.outcome == 'success' && steps.install.outcome == 'success' && steps.cover_checkpoint.outcome == 'success' }}
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          GH_META_SECRETS_PAT: ${{ secrets.GH_META_SECRETS_PAT }}
        run: |
          python3 -m py_compile meta_token_refresh.py
          python3 meta_token_refresh.py
      - name: Save all remaining state even after failed publisher
        id: final_checkpoint
        if: ${{ always() && steps.state_init.outcome == 'success' }}
        timeout-minutes: 4
        run: python3 state_checkpoint.py save final
      - name: Preserve recovery data if anything failed
        if: ${{ always() && steps.state_init.outcome == 'success' && (failure() || cancelled()) }}
        uses: actions/upload-artifact@v4
        with:
          name: crosspost-state-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hpi-state/recovery/
          if-no-files-found: warn
          retention-days: 7
