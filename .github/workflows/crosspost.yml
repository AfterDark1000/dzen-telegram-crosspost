name: Dzen to Telegram
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dzen-telegram
  cancel-in-progress: false

jobs:
  crosspost:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install browser
        run: |
          python3 -m pip install playwright pillow
          python3 -m playwright install --with-deps chromium
      - name: Read Dzen and post new articles
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          test -n "$TELEGRAM_BOT_TOKEN" || { echo "Missing TELEGRAM_BOT_TOKEN GitHub Actions secret"; exit 1; }
          python3 crosspost.py
      - name: Save published IDs
        run: |
          if [ -f seen_articles.json ] && [ -n "$(git status --porcelain -- seen_articles.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen_articles.json
            git commit -m "Update Dzen posted article IDs [skip ci]"
            git push
          fi
      - name: Post full-text articles to VK (when new wall-only key is configured)
        env:
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
        run: |
          python3 -m py_compile vk_crosspost.py
          python3 vk_crosspost.py
      - name: Save VK published IDs
        if: ${{ always() }}
        run: |
          if [ -f seen_vk_articles.json ] && [ -n "$(git status --porcelain -- seen_vk_articles.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen_vk_articles.json
            git commit -m "Update VK posted article IDs [skip ci]"
            git push
          fi
      - name: Post new articles to Instagram
        if: ${{ !cancelled() }}
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          python3 -m py_compile instagram_crosspost.py
          python3 instagram_crosspost.py
      - name: Save Instagram published IDs
        if: ${{ !cancelled() }}
        run: |
          if [ -f seen_instagram_articles.json ] && [ -n "$(git status --porcelain -- seen_instagram_articles.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen_instagram_articles.json
            git commit -m "Update Instagram posted article IDs [skip ci]"
            git push
          fi
      - name: Post new Dzen articles to Threads
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          python3 -m py_compile threads_crosspost.py
          python3 threads_crosspost.py
      - name: Save Threads published IDs
        if: ${{ !cancelled() }}
        run: |
          if [ -f seen_threads_articles.json ] && [ -n "$(git status --porcelain -- seen_threads_articles.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen_threads_articles.json
            git commit -m "Update Threads posted article IDs [skip ci]"
            git push
          fi
