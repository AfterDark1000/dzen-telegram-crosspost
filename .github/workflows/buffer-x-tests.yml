name: Buffer X safety tests (NO PUBLISHING)
on:
  pull_request:
    branches: [main]
    paths:
      - 'buffer_x_check.py'
      - 'buffer_x_crosspost.py'
      - 'x_editorial_queue.py'
      - 'tests/test_buffer_x_crosspost.py'
      - '.github/workflows/buffer-x-tests.yml'
  push:
    branches: [main]
    paths:
      - 'buffer_x_check.py'
      - 'buffer_x_crosspost.py'
      - 'x_editorial_queue.py'
      - 'tests/test_buffer_x_crosspost.py'
      - '.github/workflows/buffer-x-tests.yml'
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install import dependency (NO browser download)
        run: python3 -m pip install playwright pillow pynacl
      - name: Compile and test Buffer X without any API access
        run: |
          python3 -m py_compile buffer_x_check.py buffer_x_crosspost.py x_editorial_queue.py
          python3 -m unittest discover -s tests -p 'test_buffer_x_crosspost.py' -v
