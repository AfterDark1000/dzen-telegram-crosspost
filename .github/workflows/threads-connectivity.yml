name: Threads API connectivity check
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/threads-connectivity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install lightweight test requirements
        run: python3 -m pip install playwright pillow
      - name: Publish one introductory Threads post (deduplicated)
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          test -n "$THREADS_ACCESS_TOKEN" || { echo 'THREADS_ACCESS_TOKEN not configured'; exit 1; }
          python3 threads_crosspost.py --intro
